<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind 75 · Pattern Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E1A; --bg2:#0C1120; --panel:#121A2E; --panel2:#182142; --raise:#1E2A4E;
  --line:#26325A; --line2:#334372;
  --ink:#EAF0FF; --muted:#93A0C4; --faint:#5C6A93;
  --amber:#F7B733; --teal:#2DD4BF; --coral:#FF6B6B; --violet:#A78BFA; --sky:#5AB4F0; --rose:#F472B6; --lime:#A3E635;
  --easy:#2DD4BF; --med:#F7B733; --hard:#FF6B6B;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --dur:.42s; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(45,212,191,.08), transparent 55%),
    var(--bg);
  color:var(--ink); font-family:var(--disp);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
.mono{font-family:var(--mono)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{
  display:flex;align-items:center;gap:18px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(24,33,66,.6),rgba(12,17,32,.4));
  backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:700;letter-spacing:-.02em}
.brand .n{color:var(--amber);font-size:20px}
.brand .d{color:var(--ink);font-size:20px}
.brand .sub{color:var(--faint);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;transform:translateY(-1px)}
.spacer{flex:1}
.ring-wrap{display:flex;align-items:center;gap:10px}
.ring-wrap .lab{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.ring-wrap .lab b{color:var(--ink);font-size:15px;font-family:var(--mono)}
.kbd-hint{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:5px 9px;letter-spacing:.02em}
.kbd-hint b{color:var(--muted);font-family:var(--mono)}

.body{display:grid;grid-template-columns:322px 1fr;min-height:0}

/* ---------- Sidebar ---------- */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(18,26,46,.5),rgba(10,14,26,.2))}
.side-top{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.search:focus-within{border-color:var(--line2)}
.search input{background:none;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:13px;width:100%}
.search input::placeholder{color:var(--faint)}
.search svg{flex:none;opacity:.6}
.chips{display:flex;gap:6px}
.chip{flex:1;font-size:11px;font-weight:600;padding:6px 4px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--bg2);letter-spacing:.02em;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.side-actions{display:flex;gap:6px}
.mini-btn{flex:1;font-size:11px;font-weight:600;padding:7px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--bg2);transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.mini-btn:hover{border-color:var(--line2);color:var(--ink);background:var(--panel)}

.list{overflow-y:auto;padding:6px 8px 40px;flex:1;min-height:0}
.list::-webkit-scrollbar{width:10px}
.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.list::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:content-box}
.cat{margin-top:8px}
.cat-h{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
.cat-h:hover{background:var(--panel)}
.cat-h .caret{transition:transform .18s;color:var(--faint);flex:none}
.cat.closed .caret{transform:rotate(-90deg)}
.cat-h .nm{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);flex:1}
.cat-h .ct{font-family:var(--mono);font-size:11px;color:var(--faint)}
.cat.closed .items{display:none}
.items{padding:2px 0 4px}
.row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .13s}
.row:hover{background:var(--panel)}
.row.active{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.row .rdot{width:8px;height:8px;border-radius:50%;flex:none}
.row .rt{font-size:12.5px;color:var(--muted);flex:1;line-height:1.3;font-weight:500}
.row.active .rt{color:var(--ink)}
.row.done .rt{color:var(--faint)}
.row .rstar{opacity:0;flex:none;transition:.13s}
.row:hover .rstar,.row .rstar.on{opacity:1}
.row .rstar.on svg{fill:var(--amber);stroke:var(--amber)}
.row .rcheck{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;transition:.15s}
.row.done .rcheck{background:var(--teal);border-color:var(--teal)}
.row.done .rcheck svg{opacity:1}
.row .rcheck svg{opacity:0;transition:.15s}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.pane{padding:20px 26px 30px;max-width:1080px;width:100%;margin:0 auto}
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.phead .idx{font-family:var(--mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:7px;padding:5px 9px;margin-top:4px}
.phead .htxt{flex:1;min-width:240px}
.phead h1{margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:.03em}
.pill.diff{color:#0A0E1A}
.pill.pat{background:var(--panel2);color:var(--violet);border:1px solid var(--line2)}
.pill.pat b{color:var(--ink);font-weight:600}
.lc-link{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.lc-link:hover{border-color:var(--line2);color:var(--ink);background:var(--panel)}
.hact{display:flex;gap:8px;margin-top:2px}
.hbtn{font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--bg2);transition:.15s;display:flex;align-items:center;gap:7px}
.hbtn:hover{border-color:var(--line2);color:var(--ink)}
.hbtn.solved{background:var(--teal);border-color:var(--teal);color:#08221E}
.hbtn.star.on{color:var(--amber);border-color:#5a4a1e}

/* stage */
.stage-wrap{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:
   linear-gradient(180deg,rgba(14,20,38,.9),rgba(10,14,26,.9));
   position:relative;overflow:hidden}
.stage-wrap::before{content:"";position:absolute;inset:0;background-image:
   linear-gradient(rgba(38,50,90,.16) 1px,transparent 1px),
   linear-gradient(90deg,rgba(38,50,90,.16) 1px,transparent 1px);
   background-size:34px 34px;mask:radial-gradient(120% 100% at 50% 0%,#000 55%,transparent);pointer-events:none}
#stage{display:block;width:100%;height:auto}
#stage g,#stage rect,#stage text,#stage line,#stage path,#stage circle,#stage polygon{
  transition:transform var(--dur) var(--ease),fill .3s ease,opacity .3s ease,stroke .28s ease,stroke-width .28s ease;
}
.pulse{animation:pulse .5s var(--ease)}
@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}

.narr{display:flex;align-items:center;gap:12px;margin-top:14px;min-height:46px;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.narr .stepno{font-family:var(--mono);font-size:11px;color:var(--amber);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;flex:none}
.narr .txt{font-size:14px;color:var(--ink);line-height:1.45;font-weight:500}
.narr .txt code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 6px;border-radius:5px;color:var(--sky)}

/* transport */
.transport{display:flex;align-items:center;gap:14px;margin-top:14px}
.tbtns{display:flex;align-items:center;gap:6px}
.tbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;color:var(--muted);transition:.14s}
.tbtn:hover{border-color:var(--line2);color:var(--ink);background:var(--panel)}
.tbtn.play{width:52px;background:var(--amber);border-color:var(--amber);color:#0A0E1A}
.tbtn.play:hover{background:#ffc94d;color:#0A0E1A}
.scrub{flex:1;display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:20px;display:flex;align-items:center;cursor:pointer}
.track .rail{position:absolute;left:0;right:0;height:5px;border-radius:10px;background:var(--panel2)}
.track .fill{position:absolute;left:0;height:5px;border-radius:10px;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .18s var(--ease)}
.track .ticks{position:absolute;left:0;right:0;display:flex;justify-content:space-between;pointer-events:none}
.track .tk{width:2px;height:9px;border-radius:2px;background:var(--line2)}
.track .knob{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--ink);border:3px solid var(--amber);transform:translateX(-50%);transition:left .18s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.sctl{display:flex;align-items:center;gap:10px}
.speed{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px}
.speed button{font-size:11px;font-weight:600;padding:5px 8px;border-radius:6px;color:var(--faint);font-family:var(--mono)}
.speed button.on{background:var(--panel2);color:var(--ink)}
.loopbtn{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;color:var(--faint)}
.loopbtn.on{color:var(--teal);border-color:#1e4a44}

/* info cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.card.code{grid-column:1 / -1}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .bar{width:14px;height:2px;background:var(--amber);border-radius:2px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.card p b{color:var(--ink);font-weight:600}
.card p code,.insight code{font-family:var(--mono);font-size:12.5px;color:var(--sky);background:var(--bg2);padding:1px 6px;border-radius:5px}
.cmplx{display:flex;gap:22px;flex-wrap:wrap}
.cmplx .m{display:flex;flex-direction:column;gap:3px}
.cmplx .m .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.cmplx .m .v{font-family:var(--mono);font-size:17px;color:var(--teal);font-weight:500}
.cmplx .m.sp .v{color:var(--violet)}
pre.code{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--muted);overflow-x:auto}
pre.code .ln{display:block;padding:0 8px;border-radius:5px;transition:background .2s,color .2s}
pre.code .ln .g{color:var(--faint)}
pre.code .ln.hl{background:rgba(247,183,51,.12);color:var(--ink);box-shadow:inset 2px 0 0 var(--amber)}
pre.code .kw{color:var(--violet)} pre.code .fn{color:var(--sky)} pre.code .st{color:var(--teal)} pre.code .cm{color:var(--faint);font-style:italic}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding:0 2px}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.legend .lg i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.15)}

.empty{padding:60px;text-align:center;color:var(--faint)}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .side{position:fixed;inset:52px 0 0 0;z-index:30;width:100%;transform:translateX(-100%);transition:transform .25s;background:var(--bg)}
  .side.open{transform:none}
  .cards{grid-template-columns:1fr}
  .menu-btn{display:grid!important}
}
.menu-btn{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle problem list">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <span class="n">Blind</span><span class="d">75</span>
      <span class="sub">Pattern Dojo</span>
    </div>
    <div class="spacer"></div>
    <div class="kbd-hint"><b>Space</b> play · <b>←→</b> step · <b>J/K</b> problem · <b>R</b> random</div>
    <div class="ring-wrap">
      <div class="lab">Revised today<br><b id="ringLab">0/75</b></div>
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="17" fill="none" stroke="var(--line)" stroke-width="4"/>
        <circle id="ring" cx="21" cy="21" r="17" fill="none" stroke="var(--teal)" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="106.8" stroke-dashoffset="106.8"
          transform="rotate(-90 21 21)" style="transition:stroke-dashoffset .5s var(--ease)"/>
      </svg>
    </div>
  </div>

  <div class="body">
    <aside class="side" id="side">
      <div class="side-top">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" placeholder="search problems…" spellcheck="false">
        </div>
        <div class="chips" id="chips">
          <button class="chip on" data-f="all">All</button>
          <button class="chip" data-f="Easy"><span class="dot" style="background:var(--easy)"></span>Easy</button>
          <button class="chip" data-f="Medium"><span class="dot" style="background:var(--med)"></span>Med</button>
          <button class="chip" data-f="Hard"><span class="dot" style="background:var(--hard)"></span>Hard</button>
        </div>
        <div class="side-actions">
          <button class="mini-btn" id="randBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>Random</button>
          <button class="mini-btn" id="starFilter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 21.5 12 17.5 5.5 21.5 7 14.5 2 9.5 9 9"/></svg>Starred</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <main class="main" id="main">
      <div class="pane" id="pane"></div>
    </main>
  </div>
</div>

<script>
/* =====================================================================
   SVG helpers
   ===================================================================== */
const SVGNS="http://www.w3.org/2000/svg";
function E(tag,attrs,kids){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs)for(const k in attrs){ if(k==="text")e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(kids)kids.forEach(c=>c&&e.appendChild(c));
  return e;
}
const C={amber:'var(--amber)',teal:'var(--teal)',coral:'var(--coral)',violet:'var(--violet)',sky:'var(--sky)',rose:'var(--rose)',lime:'var(--lime)',ink:'var(--ink)',muted:'var(--muted)',faint:'var(--faint)',line:'var(--line)',line2:'var(--line2)',panel:'var(--panel)',panel2:'var(--panel2)'};
function col(x){return C[x]||x;}
const VB={w:900,h:440};
function stageSVG(){
  const s=document.getElementById('stage');
  s.setAttribute('viewBox',`0 0 ${VB.w} ${VB.h}`);
  s.innerHTML='';
  return s;
}

/* =====================================================================
   Renderers.  Each: build(svg, base) -> refs ;  update(refs, frame)
   A "frame" = { st:{...state...}, note, code }
   ===================================================================== */

/* ---- shared: state class -> fill/stroke for a cell ---- */
function cellSkin(state){
  // returns {fill, stroke, tcol}
  switch(state){
    case 'active':  return {fill:'rgba(247,183,51,.16)', stroke:col('amber'),  tcol:col('amber'),  glow:1};
    case 'compare': return {fill:'rgba(255,107,107,.15)',stroke:col('coral'),  tcol:col('coral')};
    case 'done':    return {fill:'rgba(45,212,191,.15)', stroke:col('teal'),   tcol:col('teal')};
    case 'window':  return {fill:'rgba(90,180,240,.16)', stroke:col('sky'),    tcol:col('ink')};
    case 'pick':    return {fill:'rgba(167,139,250,.18)',stroke:col('violet'), tcol:col('violet')};
    case 'dim':     return {fill:'rgba(30,42,78,.35)',   stroke:col('line'),   tcol:col('faint')};
    default:        return {fill:'var(--bg2)',           stroke:col('line2'),  tcol:col('ink')};
  }
}

/* ============================ ARRAY ============================ */
const ArrayR={
  build(svg,base){
    const vals=base.values, n=vals.length;
    const cw=Math.min(72, (VB.w-140)/n - 12), gap=12, ch=cw;
    const total=n*cw+(n-1)*gap, x0=(VB.w-total)/2, y0=150;
    const refs={cw,gap,ch,x0,y0,n,cells:[],idxs:[],ptrs:{},window:null,kv:null,read:null};
    // window band
    refs.window=E('rect',{x:x0,y:y0-9,width:0,height:ch+18,rx:12,fill:'rgba(90,180,240,.09)',stroke:col('sky'),'stroke-width':1,opacity:0});
    svg.appendChild(refs.window);
    for(let i=0;i<n;i++){
      const cx=x0+i*(cw+gap);
      const g=E('g',{}); g.style.transform=`translate(${cx}px,${y0}px)`;
      const r=E('rect',{width:cw,height:ch,rx:12,fill:'var(--bg2)',stroke:col('line2'),'stroke-width':1.5});
      const t=E('text',{x:cw/2,y:ch/2+1,'text-anchor':'middle','dominant-baseline':'central','font-family':'var(--mono)','font-size':Math.min(22,cw*0.4),'font-weight':700,fill:col('ink'),text:String(vals[i])});
      const idx=E('text',{x:cw/2,y:-12,'text-anchor':'middle','font-family':'var(--mono)','font-size':11,fill:col('faint'),text:String(i)});
      g.appendChild(r);g.appendChild(t);
      svg.appendChild(g);svg.appendChild(idx);
      refs.cells.push({g,r,t}); refs.idxs.push(idx);
    }
    refs.read=E('text',{x:VB.w/2,y:y0+ch+96,'text-anchor':'middle','font-family':'var(--mono)','font-size':15,fill:col('muted'),text:''});
    svg.appendChild(refs.read);
    refs._svg=svg;
    return refs;
  },
  update(refs,f){
    const st=f.st||{}, vals=st.values;
    const skins=st.cells||[];
    for(let i=0;i<refs.n;i++){
      const cell=refs.cells[i]; if(!cell)continue;
      const sk=cellSkin(skins[i]||'');
      cell.r.setAttribute('fill',sk.fill); cell.r.setAttribute('stroke',sk.stroke);
      cell.r.setAttribute('stroke-width',sk.glow?2.5:1.5);
      cell.r.style.filter=sk.glow?'drop-shadow(0 0 10px rgba(247,183,51,.55))':'none';
      cell.t.setAttribute('fill',sk.tcol);
      if(vals&&vals[i]!==undefined&&String(vals[i])!==cell.t.textContent){

/* pointers under cells */
function drawPointers(refs,ptrs,py){
  ptrs=ptrs||{};

  const seen={};

  const byIndex={};
  Object.keys(ptrs).forEach(name=>{ const at=ptrs[name]; (byIndex[at]=byIndex[at]||[]).push(name); });
  Object.keys(ptrs).forEach(name=>{
    seen[name]=1;
    const at=ptrs[name];
    const order=byIndex[at].indexOf(name);

      const lab=E('text',{x:0,y:20,'text-anchor':'middle','font-family':'var(--mono)','font-size':12,'font-weight':700,fill:colr,text:name});
      g.appendChild(tri);g.appendChild(lab);

function ptrColor(name){

function curvedArrow(a,b,nw,color,dashed){

  else d=`M ${sx} ${a.y} L ${ex} ${b.y}`;

/* ============================ TRIE ============================ */
const TrieR={
  build(svg,base){
    // layout like a tree using explicit x,y (0..1)
    const refs={nodes:{},edges:{},_svg:svg,read:null};
    refs.edgeG=E('g',{}); svg.appendChild(refs.edgeG);
    const px=n=>60+n.x*(VB.w-120), py=n=>70+n.y*(VB.h-160);
    base.nodes.forEach(n=>{ if(n.parent!=null){ const p=base.nodes.find(m=>m.id===n.parent);
      const ln=E('line',{x1:px(p),y1:py(p),x2:px(n),y2:py(n),stroke:col('line2'),'stroke-width':2});
      refs.edgeG.appendChild(ln); refs.edges[n.id]=ln;
    }});
    base.nodes.forEach(n=>{
      const g=E('g',{}); g.style.transform=`translate(${px(n)}px,${py(n)}px)`;
      const cc=E('circle',{r:19,fill:n.id==='root'?'var(--panel2)':'var(--bg2)',stroke:col('line2'),'stroke-width':2});
      const t=E('text',{x:0,y:1,'text-anchor':'middle','dominant-baseline':'central','font-family':'var(--mono)','font-size':15,'font-weight':700,fill:col('ink'),text:n.id==='root'?'•':n.ch});
      g.appendChild(cc);g.appendChild(t);
      if(n.end){ g.appendChild(E('circle',{r:24,fill:'none',stroke:col('teal'),'stroke-width':1.5,'stroke-dasharray':'3 3'})); }
      svg.appendChild(g); refs.nodes[n.id]={g,cc,t,end:n.end};
    });
    refs.read=E('text',{x:VB.w/2,y:VB.h-14,'text-anchor':'middle','font-family':'var(--mono)','font-size':15,fill:col('muted'),text:''});
    svg.appendChild(refs.read);
    return refs;
  },
  update(refs,f){
    const st=f.st||{}, marks=st.marks||{}, vis=st.visible;
    for(const id in refs.nodes){
      const nd=refs.nodes[id];
      const shown=!vis||vis.includes(id)||id==='root';
      nd.g.setAttribute('opacity',shown?1:0.12);
      if(refs.edges[id])refs.edges[id].setAttribute('opacity',shown?1:0.12);
      const sk=cellSkin(marks[id]||'');
      nd.cc.setAttribute('fill',marks[id]?sk.fill:(id==='root'?'var(--panel2)':'var(--bg2)'));
      nd.cc.setAttribute('stroke',marks[id]?sk.stroke:col('line2'));
      nd.cc.setAttribute('stroke-width',sk.glow?3:2);
      nd.cc.style.filter=sk.glow?'drop-shadow(0 0 8px rgba(247,183,51,.5))':'none';
      nd.t.setAttribute('fill',marks[id]?sk.tcol:col('ink'));
    }
    refs.read.textContent=st.read||'';
  }
};

function fgr(o){return {st:{marks:o.m||{},edges:o.e||{},read:o.r||""},note:o.n||"",code:o.k};}
function fst(o){return {st:{stack:o.stack||[],inputMarks:o.im||{},read:o.r||""},note:o.n||"",code:o.k};}
function fin(o){return {st:{bars:o.bars||[],read:o.r||""},note:o.n||"",code:o.k};}
function fbi(o){return {st:{bits:o.bits||[],marks:o.m||{},title:o.title||"",read:o.r||""},note:o.n||"",code:o.k};}
function fh(o){return {st:{left:o.left||[],right:o.right||[],leftTitle:o.lt,rightTitle:o.rt,read:o.r||""},note:o.n||"",code:o.k};}
function ftr(o){return {st:{marks:o.m||{},visible:o.vis||null,read:o.r||""},note:o.n||"",code:o.k};}

/* =====================================================================
   App state + persistence
   ===================================================================== */
const CAT_ORDER=["Arrays & Hashing","Two Pointers","Sliding Window","Stack","Binary Search","Linked List","Trees","Heap / Priority Queue","Backtracking","Tries","Graphs","Advanced Graphs","1-D Dynamic Programming","2-D Dynamic Programming","Greedy","Intervals","Math & Geometry","Bit Manipulation"];
const DIFF_COL={Easy:"var(--easy)",Medium:"var(--med)",Hard:"var(--hard)"};

const store={
  read(k,d){ try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;} },
  write(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
};
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
let doneSet=new Set(store.read("b75_done_"+todayKey(),[]));
let starSet=new Set(store.read("b75_star",[]));
let state={cur:null,frame:0,playing:false,timer:null,speed:1,loop:true,refs:null,renderer:null,filter:"all",star:false,q:""};

/* =====================================================================
   Sidebar
   ===================================================================== */
const listEl=document.getElementById("list");
function buildSidebar(){
  listEl.innerHTML="";
  CAT_ORDER.forEach(cat=>{
    const items=PROBLEMS.filter(p=>p.cat===cat);
    if(!items.length)return;
    const wrap=document.createElement("div");wrap.className="cat";wrap.dataset.cat=cat;
    const h=document.createElement("div");h.className="cat-h";
    h.innerHTML='<svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg><span class="nm">'+cat+'</span><span class="ct">'+items.length+'</span>';
    h.onclick=()=>wrap.classList.toggle("closed");
    wrap.appendChild(h);
    const box=document.createElement("div");box.className="items";
    items.forEach(p=>{
      const row=document.createElement("div");row.className="row";row.dataset.n=p.n;
      row.innerHTML='<span class="rdot" style="background:'+DIFF_COL[p.diff]+'"></span>'+
        '<span class="rt">'+p.title+'</span>'+
        '<span class="rstar" title="star"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 21.5 12 17.5 5.5 21.5 7 14.5 2 9.5 9 9"/></svg></span>'+
        '<span class="rcheck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#06231f" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg></span>';
      if(doneSet.has(p.n))row.classList.add("done");
      if(starSet.has(p.n))row.querySelector(".rstar").classList.add("on");
      row.querySelector(".rstar").addEventListener("click",ev=>{ev.stopPropagation();toggleStar(p,row);});
      row.querySelector(".rcheck").addEventListener("click",ev=>{ev.stopPropagation();toggleDone(p,row);});
      row.addEventListener("click",()=>selectProblem(p));
      box.appendChild(row);
    });
    wrap.appendChild(box);
    listEl.appendChild(wrap);
  });
}

/* =====================================================================
   Helpers: note formatting, difficulty color, problem index
   ===================================================================== */
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtNote(s){return escapeHtml(s||"").replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
const byN={};
PROBLEMS.forEach(p=>byN[p.n]=p);

/* icons */
const IC_PLAY='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const IC_PAUSE='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

/* =====================================================================
   Star / done toggles + progress ring
   ===================================================================== */
function persistDone(){store.write("b75_done_"+todayKey(),[...doneSet]);}
function persistStar(){store.write("b75_star",[...starSet]);}
function updateRing(){
  const r=doneSet.size, ratio=r/PROBLEMS.length;
  const ring=document.getElementById("ring");
  if(ring)ring.setAttribute("stroke-dashoffset",(106.8*(1-ratio)).toFixed(2));
  const lab=document.getElementById("ringLab");
  if(lab)lab.textContent=r+"/"+PROBLEMS.length;
}
function toggleDone(p,row){
  if(doneSet.has(p.n))doneSet.delete(p.n); else doneSet.add(p.n);
  persistDone();
  if(row)row.classList.toggle("done",doneSet.has(p.n));
  if(state.cur&&state.cur.n===p.n)syncSolveBtn();
  updateRing();
}
function toggleStar(p,row){
  if(starSet.has(p.n))starSet.delete(p.n); else starSet.add(p.n);
  persistStar();
  if(row)row.querySelector(".rstar").classList.toggle("on",starSet.has(p.n));
  if(state.cur&&state.cur.n===p.n)syncStarBtn();
  if(state.star)applyFilter();
}
function syncSolveBtn(){
  const b=document.getElementById("solveBtn"); if(!b)return;
  const on=doneSet.has(state.cur.n);
  b.classList.toggle("solved",on);
  b.innerHTML=(on?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>Revised today':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>Mark revised');
}
function syncStarBtn(){
  const b=document.getElementById("starBtn"); if(!b)return;
  const on=starSet.has(state.cur.n);
  b.classList.toggle("on",on);
  b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 21.5 12 17.5 5.5 21.5 7 14.5 2 9.5 9 9"/></svg>'+(on?'Starred':'Star');
}

/* =====================================================================
   Filtering
   ===================================================================== */
function applyFilter(){
  const q=state.q.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(cat=>{
    let vis=0;
    cat.querySelectorAll(".row").forEach(row=>{
      const p=byN[+row.dataset.n];
      let ok=true;
      if(q&&!p.title.toLowerCase().includes(q))ok=false;
      if(state.filter!=="all"&&p.diff!==state.filter)ok=false;
      if(state.star&&!starSet.has(p.n))ok=false;
      row.style.display=ok?"":"none";
      if(ok)vis++;
    });
    cat.style.display=vis?"":"none";
  });
}

/* =====================================================================
   Problem selection + pane construction
   ===================================================================== */
function selectProblem(p){
  pausePlayback();
  state.cur=p; state.frame=0;
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("active",+r.dataset.n===p.n));
  const total=p.viz.frames.length;
  const codeHtml=p.code.map((ln,i)=>'<span class="ln" data-l="'+i+'"><span class="g">'+String(i+1).padStart(2," ")+'</span>  '+escapeHtml(ln)+'</span>').join("");
  const pane=document.getElementById("pane");
  pane.innerHTML=
    '<div class="phead">'+
      '<div class="idx">#'+String(p.n).padStart(2,"0")+'</div>'+
      '<div class="htxt"><h1>'+escapeHtml(p.title)+'</h1>'+
        '<div class="tags">'+
          '<span class="pill diff" style="background:'+DIFF_COL[p.diff]+'">'+p.diff+'</span>'+
          '<span class="pill pat">Pattern · <b>'+escapeHtml(p.pat)+'</b></span>'+
          '<a class="lc-link" href="'+p.url+'" target="_blank" rel="noopener">LeetCode'+
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>'+
        '</div>'+
      '</div>'+
      '<div class="hact">'+
        '<button class="hbtn star" id="starBtn"></button>'+
        '<button class="hbtn solve" id="solveBtn"></button>'+
      '</div>'+
    '</div>'+
    '<div class="stage-wrap"><svg id="stage"></svg></div>'+
    '<div class="narr"><span class="stepno" id="stepno">1 / '+total+'</span><span class="txt" id="narrtxt"></span></div>'+
    '<div class="transport">'+
      '<div class="tbtns">'+
        '<button class="tbtn" id="restartBtn" title="Restart (R)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>'+
        '<button class="tbtn" id="backBtn" title="Step back (←)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 6 9 12 15 18"/></svg></button>'+
        '<button class="tbtn play" id="playBtn" title="Play / Pause (Space)">'+IC_PLAY+'</button>'+
        '<button class="tbtn" id="fwdBtn" title="Step forward (→)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg></button>'+
      '</div>'+
      '<div class="scrub"><div class="track" id="track">'+
        '<div class="rail"></div><div class="fill" id="fill"></div>'+
        '<div class="ticks" id="ticks"></div>'+
        '<div class="knob" id="knob"></div>'+
      '</div></div>'+
      '<div class="sctl">'+
        '<div class="speed" id="speed">'+
          '<button data-s="0.5">.5×</button><button data-s="1" class="on">1×</button>'+
          '<button data-s="1.5">1.5×</button><button data-s="2">2×</button>'+
        '</div>'+
        '<button class="loopbtn'+(state.loop?" on":"")+'" id="loopBtn" title="Loop"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>'+
      '</div>'+
    '</div>'+
    '<div class="legend">'+
      '<div class="lg"><i style="background:rgba(247,183,51,.4);border-color:var(--amber)"></i>Active / cursor</div>'+
      '<div class="lg"><i style="background:rgba(255,107,107,.4);border-color:var(--coral)"></i>Compare</div>'+
      '<div class="lg"><i style="background:rgba(45,212,191,.4);border-color:var(--teal)"></i>Done / matched</div>'+
      '<div class="lg"><i style="background:rgba(90,180,240,.4);border-color:var(--sky)"></i>Window / visited</div>'+
      '<div class="lg"><i style="background:rgba(167,139,250,.4);border-color:var(--violet)"></i>Chosen</div>'+
    '</div>'+
    '<div class="cards">'+
      '<div class="card insight"><h3><span class="bar"></span>Insight</h3><p>'+fmtNote(p.insight)+'</p></div>'+
      '<div class="card"><h3><span class="bar"></span>Complexity · Pattern</h3>'+
        '<div class="cmplx"><div class="m"><span class="k">Time</span><span class="v">'+escapeHtml(p.time)+'</span></div>'+
        '<div class="m sp"><span class="k">Space</span><span class="v">'+escapeHtml(p.space)+'</span></div>'+
        '<div class="m"><span class="k">Pattern</span><span class="v" style="color:var(--sky);font-size:13px">'+escapeHtml(p.pat)+'</span></div></div></div>'+
      '<div class="card code"><h3><span class="bar"></span>Approach · pseudocode</h3><pre class="code" id="code">'+codeHtml+'</pre></div>'+
    '</div>';

  state.codeLines=[...pane.querySelectorAll("#code .ln")];
  // ticks
  const ticks=document.getElementById("ticks");
  for(let i=0;i<total;i++){const t=document.createElement("div");t.className="tk";ticks.appendChild(t);}

  // stage + renderer
  const svg=stageSVG();
  state.renderer=RENDERERS[p.viz.type];
  state.refs=state.renderer.build(svg,p.viz.base);

  // wire pane controls
  document.getElementById("playBtn").onclick=togglePlay;
  document.getElementById("backBtn").onclick=()=>step(-1);
  document.getElementById("fwdBtn").onclick=()=>step(1);
  document.getElementById("restartBtn").onclick=()=>{state.frame=0;renderFrame();};
  document.getElementById("loopBtn").onclick=function(){state.loop=!state.loop;this.classList.toggle("on",state.loop);store.write("b75_loop",state.loop);};
  document.querySelectorAll("#speed button").forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s,b));
  document.getElementById("solveBtn").onclick=()=>{const r=document.querySelector('.row[data-n="'+p.n+'"]');toggleDone(p,r);};
  document.getElementById("starBtn").onclick=()=>{const r=document.querySelector('.row[data-n="'+p.n+'"]');toggleStar(p,r);};
  wireTrack();
  syncSolveBtn(); syncStarBtn();

  renderFrame();
  // close mobile menu
  document.getElementById("side").classList.remove("open");
  // autoplay
  setTimeout(()=>{ if(state.cur===p) play(); },260);
}

/* =====================================================================
   Frame render
   ===================================================================== */
function renderFrame(){
  const p=state.cur; if(!p)return;
  const total=p.viz.frames.length;
  state.frame=Math.max(0,Math.min(state.frame,total-1));
  const f=p.viz.frames[state.frame];
  state.renderer.update(state.refs,f);
  const nt=document.getElementById("narrtxt"); if(nt)nt.innerHTML=fmtNote(f.note);
  const sn=document.getElementById("stepno"); if(sn)sn.textContent=(state.frame+1)+" / "+total;
  // code highlight
  if(state.codeLines){
    state.codeLines.forEach(l=>l.classList.remove("hl"));
    let ci=f.code;
    if(ci!=null){
      if(ci>=state.codeLines.length)ci=state.codeLines.length-1;
      if(ci>=0&&state.codeLines[ci])state.codeLines[ci].classList.add("hl");
    }
  }
  // scrubber
  const ratio=total>1?state.frame/(total-1):0;
  const fill=document.getElementById("fill"), knob=document.getElementById("knob");
  if(fill)fill.style.width=(ratio*100)+"%";
  if(knob)knob.style.left=(ratio*100)+"%";
}

/* =====================================================================
   Playback transport
   ===================================================================== */
function play(){
  const p=state.cur; if(!p)return;
  if(state.frame>=p.viz.frames.length-1)state.frame=0;
  state.playing=true;
  const b=document.getElementById("playBtn"); if(b)b.innerHTML=IC_PAUSE;
  clearInterval(state.timer);
  state.timer=setInterval(tick,Math.round(1500/state.speed));
  renderFrame();
}
function pausePlayback(){
  state.playing=false;
  clearInterval(state.timer); state.timer=null;
  const b=document.getElementById("playBtn"); if(b)b.innerHTML=IC_PLAY;
}
function togglePlay(){ state.playing?pausePlayback():play(); }
function tick(){
  const p=state.cur; if(!p)return;
  if(state.frame<p.viz.frames.length-1){ state.frame++; renderFrame(); }
  else if(state.loop){ state.frame=0; renderFrame(); }
  else pausePlayback();
}
function step(d){ pausePlayback(); state.frame+=d; renderFrame(); }
function setSpeed(s,btn){
  state.speed=s;
  document.querySelectorAll("#speed button").forEach(b=>b.classList.toggle("on",b===btn));
  if(state.playing){ clearInterval(state.timer); state.timer=setInterval(tick,Math.round(1500/state.speed)); }
}
function wireTrack(){
  const track=document.getElementById("track"); if(!track)return;
  const seek=ev=>{
    const rc=track.getBoundingClientRect();
    const x=(ev.touches?ev.touches[0].clientX:ev.clientX)-rc.left;
    const ratio=Math.max(0,Math.min(1,x/rc.width));
    const total=state.cur.viz.frames.length;
    state.frame=Math.round(ratio*(total-1));
    renderFrame();
  };
  let drag=false;
  track.addEventListener("mousedown",e=>{drag=true;pausePlayback();seek(e);});
  window.addEventListener("mousemove",e=>{if(drag)seek(e);});
  window.addEventListener("mouseup",()=>drag=false);
  track.addEventListener("touchstart",e=>{pausePlayback();seek(e);},{passive:true});
  track.addEventListener("touchmove",e=>seek(e),{passive:true});
}

/* =====================================================================
   Sidebar controls: search, chips, random, star filter, menu
   ===================================================================== */
function pickRandom(){
  const pool=PROBLEMS.filter(p=>{
    if(state.filter!=="all"&&p.diff!==state.filter)return false;
    if(state.star&&!starSet.has(p.n))return false;
    return true;
  });
  if(!pool.length)return;
  const p=pool[Math.floor(Math.random()*pool.length)];
  const cat=document.querySelector('.cat[data-cat="'+CSS.escape(p.cat)+'"]');
  if(cat)cat.classList.remove("closed");
  selectProblem(p);
  const row=document.querySelector('.row[data-n="'+p.n+'"]');
  if(row)row.scrollIntoView({block:"center",behavior:"smooth"});
}

/* =====================================================================
   Init
   ===================================================================== */
function init(){
  state.loop=store.read("b75_loop",true);
  buildSidebar();
  updateRing();

  document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;applyFilter();});
  document.querySelectorAll("#chips .chip").forEach(c=>c.onclick=()=>{
    document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); state.filter=c.dataset.f; applyFilter();
  });
  document.getElementById("randBtn").onclick=pickRandom;
  document.getElementById("starFilter").onclick=function(){
    state.star=!state.star; this.classList.toggle("on",state.star);
    this.style.color=state.star?"var(--amber)":""; this.style.borderColor=state.star?"#5a4a1e":"";
    applyFilter();
  };
  document.getElementById("menuBtn").onclick=()=>document.getElementById("side").classList.toggle("open");

  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT")return;
    if(e.code==="Space"){e.preventDefault();togglePlay();}
    else if(e.code==="ArrowRight"){e.preventDefault();step(1);}
    else if(e.code==="ArrowLeft"){e.preventDefault();step(-1);}
    else if(e.key==="j"||e.key==="J"){e.preventDefault();move(1);}
    else if(e.key==="k"||e.key==="K"){e.preventDefault();move(-1);}
    else if(e.key==="r"||e.key==="R"){e.preventDefault();state.frame=0;renderFrame();}
  });

  applyFilter();
  selectProblem(PROBLEMS[0]);
}
function move(d){
  if(!state.cur)return;
  let i=PROBLEMS.findIndex(p=>p.n===state.cur.n);
  i=(i+d+PROBLEMS.length)%PROBLEMS.length;
  const p=PROBLEMS[i];
  const cat=document.querySelector('.cat[data-cat="'+CSS.escape(p.cat)+'"]');
  if(cat)cat.classList.remove("closed");
  selectProblem(p);
  const row=document.querySelector('.row[data-n="'+p.n+'"]');
  if(row)row.scrollIntoView({block:"nearest",behavior:"smooth"});
}

init();
</script>
