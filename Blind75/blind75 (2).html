/* ---------- shared panel/vars HTML ---------- */
function panelsHTML(frame){
  if(!frame.panels||!frame.panels.length) return '';
  return frame.panels.map(p=>{
    let chips='';
    if(p.kind==='map'){
      const ks=Object.keys(p.data);
      chips = ks.length? ks.map(k=>`<span class="chip ${String(k)===String(p.hi)?'chip-hi':''}"><b>${k}</b><i>${p.data[k]}</i></span>`).join('') : '<span class="chip empty">∅</span>';
    } else { // set / list
      const arr = Array.isArray(p.data)?p.data:[];
      chips = arr.length? arr.map(v=>`<span class="chip ${String(v)===String(p.hi)?'chip-hi':''}">${v}</span>`).join('') : '<span class="chip empty">∅</span>';
    }
    return `<div class="panel"><div class="panel-label">${p.label}</div><div class="panel-chips">${chips}</div></div>`;
  }).join('');
}
function varsHTML(frame){
  if(!frame.vars||!Object.keys(frame.vars).length) return '';
  return '<div class="vars">'+Object.entries(frame.vars).map(([k,v])=>`<span class="var"><em>${k}</em><b>${v}</b></span>`).join('')+'</div>';
}
const clsMap = c => c?('cl-'+c):'';

/* ============================================================
   ROWS visualizer (arrays, strings, stacks, bars, dp)
   ============================================================ */
function RowsViz(){
  let mount, meta=[], rowEls=[];
  return {
    setup(m, frames){
      mount=m; mount.innerHTML=''; meta=[]; rowEls=[];
      frames.forEach(f=>(f.rows||[]).forEach((r,i)=>{
        if(!meta[i]) meta[i]={maxLen:0,label:'',type:'cells',maxVal:1};
        meta[i].maxLen=Math.max(meta[i].maxLen, r.arr.length);
        if(r.label) meta[i].label=r.label;
        if(r.type==='bars') meta[i].type='bars';
        r.arr.forEach(v=>{ const n=Number(v); if(!isNaN(n)) meta[i].maxVal=Math.max(meta[i].maxVal, Math.abs(n)); });
      }));
      const wrap=document.createElement('div'); wrap.className='rows-wrap';
      meta.forEach((m2,i)=>{
        const row=document.createElement('div'); row.className='viz-row'+(m2.type==='bars'?' bars':'');
        const lab=document.createElement('div'); lab.className='row-label'; lab.textContent=m2.label||'';
        const track=document.createElement('div'); track.className='track';
        const band=document.createElement('div'); band.className='band'; band.style.opacity=0; track.appendChild(band);
        const cellsEl=document.createElement('div'); cellsEl.className='cells';
        const cells=[];
        for(let j=0;j<m2.maxLen;j++){
          const cell=document.createElement('div'); cell.className='cell'+(m2.type==='bars'?' bar':'');
          if(m2.type==='bars'){ const bf=document.createElement('div'); bf.className='barfill'; cell.appendChild(bf); }
          const cv=document.createElement('span'); cv.className='cv'; cell.appendChild(cv);
          cellsEl.appendChild(cell); cells.push(cell);
        }
        track.appendChild(cellsEl);
        const ptrLayer=document.createElement('div'); ptrLayer.className='ptr-layer';
        track.appendChild(ptrLayer);
        row.appendChild(lab); row.appendChild(track);
        wrap.appendChild(row);
        rowEls.push({row,cells,band,ptrLayer,ptrs:{}});
      });
      mount.appendChild(wrap);
      const extra=document.createElement('div'); extra.className='extra';
      mount.appendChild(extra);
      this._extra=extra;
    },
    show(frame){
      meta.forEach((m2,i)=>{
        const re=rowEls[i]; const fr=(frame.rows||[])[i];
        if(!fr){ re.row.style.opacity=.15; return; }
        re.row.style.opacity=1;
        const cls=fr.cls||{};
        re.cells.forEach((cell,j)=>{
          if(j<fr.arr.length){
            cell.style.display=''; cell.classList.remove('hidden');
            const val=fr.arr[j];
            cell.querySelector('.cv').textContent=val;
            cell.className='cell'+(m2.type==='bars'?' bar':'')+' '+clsMap(cls[j]);
            if(m2.type==='bars'){
              const n=Number(val)||0; const h=Math.max(6, Math.round(Math.abs(n)/m2.maxVal*128));
              cell.querySelector('.barfill').style.height=h+'px';
            }
          } else { cell.classList.add('hidden'); }
        });
        // window band
        if(fr.win){ const [a,b]=fr.win; re.band.style.opacity=1; re.band.style.left=(a*STEP-2)+'px'; re.band.style.width=((b-a+1)*STEP-GAP+4)+'px'; }
        else re.band.style.opacity=0;
        // pointers
        const want=fr.ptr||{};
        Object.keys(re.ptrs).forEach(name=>{ if(!(name in want)){ re.ptrs[name].style.opacity=0; } });
        Object.entries(want).forEach(([name,idx],order)=>{
          let chip=re.ptrs[name];
          if(!chip){ chip=document.createElement('div'); chip.className='ptr'; chip.innerHTML=`<span>${ptrLabel(name)}</span><i></i>`;
            chip.style.color=ptrColor(name); re.ptrLayer.appendChild(chip); re.ptrs[name]=chip; }
          chip.style.opacity=1;
          chip.style.left=(idx*STEP+CELLW/2)+'px';
          chip.style.top=(order%2?'-46px':'-26px');
        });
      });
      this._extra.innerHTML = varsHTML(frame)+panelsHTML(frame);
    },
    clear(){ if(mount) mount.innerHTML=''; }
  };
}

/* ============================================================
   TREE visualizer
   ============================================================ */
function TreeViz(){
  let mount, nodeEls={}, svg, maxX=0, maxY=0;
  return {
    setup(m, frames){
      mount=m; mount.innerHTML=''; nodeEls={}; maxX=0; maxY=0;
      frames.forEach(f=>f.nodes.forEach(n=>{ maxX=Math.max(maxX,n.x); maxY=Math.max(maxY,n.y); }));
      const stage=document.createElement('div'); stage.className='tree-stage';
      stage.style.width=(maxX+70)+'px'; stage.style.height=(maxY+70)+'px';
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','tree-svg'); svg.setAttribute('width',maxX+70); svg.setAttribute('height',maxY+70);
      stage.appendChild(svg);
      mount.appendChild(stage); this._stage=stage;
      const extra=document.createElement('div'); extra.className='extra'; mount.appendChild(extra); this._extra=extra;
    },
    show(frame){
      const pos={}; frame.nodes.forEach(n=>pos[n.id]=n);
      // edges
      svg.innerHTML='';
      frame.edges.forEach(e=>{
        const a=pos[e.a], b=pos[e.b]; if(!a||!b) return;
        const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
        ln.setAttribute('x1',a.x+22); ln.setAttribute('y1',a.y+22);
        ln.setAttribute('x2',b.x+22); ln.setAttribute('y2',b.y+22);
        ln.setAttribute('class','edge '+(e.state==='path'?'edge-path':''));
        svg.appendChild(ln);
      });
      const seen=new Set();
      frame.nodes.forEach(n=>{
        seen.add(n.id);
        let el=nodeEls[n.id];
        if(!el){ el=document.createElement('div'); el.className='tnode'; el.innerHTML=`<span>${n.val}</span>`;
          this._stage.appendChild(el); nodeEls[n.id]=el; }
        el.style.transform=`translate(${n.x}px,${n.y}px)`;
        el.className='tnode st-'+(n.state||'idle');
        el.style.opacity=1;
      });
      Object.keys(nodeEls).forEach(id=>{ if(!seen.has(+id)&&!seen.has(id)) nodeEls[id].style.opacity=0; });
      this._extra.innerHTML = varsHTML(frame)+panelsHTML(frame);
    },
    clear(){ if(mount) mount.innerHTML=''; }
  };
}

/* ============================================================
   LIST visualizer (reverse / cycle)
   ============================================================ */
function ListViz(){
  let mount, stage, svg, nodeEls={}, order=[], STEPX=112, RAD=24, y=70;
  return {
    setup(m, frames){
      mount=m; mount.innerHTML=''; nodeEls={};
      order=frames[0].nodes.map(n=>n.id);
      const W=order.length*STEPX+60, H=190;
      stage=document.createElement('div'); stage.className='list-stage'; stage.style.width=W+'px'; stage.style.height=H+'px';
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('width',W); svg.setAttribute('height',H); svg.setAttribute('class','list-svg');
      const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
      defs.innerHTML='<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8b96b8"/></marker>'+
                     '<marker id="arrowc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ff6b81"/></marker>';
      svg.appendChild(defs); stage.appendChild(svg);
      frames[0].nodes.forEach((n,idx)=>{
        const el=document.createElement('div'); el.className='lnode'; el.innerHTML=`<span>${n.val}</span>`;
        el.style.left=(30+idx*STEPX)+'px'; el.style.top=(y-RAD)+'px';
        stage.appendChild(el); nodeEls[n.id]=el;
      });
      mount.appendChild(stage);
      const extra=document.createElement('div'); extra.className='extra'; mount.appendChild(extra); this._extra=extra;
      this._px = id => 30 + order.indexOf(id)*STEPX + RAD;
    },
    show(frame){
      // reset node classes
      Object.values(nodeEls).forEach(e=>e.className='lnode');
      // links
      while(svg.childNodes.length>1) svg.removeChild(svg.lastChild);
      (frame.links||[]).forEach(lk=>{
        const x1=this._px(lk.from), x2=this._px(lk.to);
        const cyc = lk.state==='cycle';
        const back = order.indexOf(lk.to) < order.indexOf(lk.from);
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        if(cyc || back){
          const dir = cyc? 1 : -1; const cy = y + dir*58;
          path.setAttribute('d',`M ${x1} ${y+dir*RAD*0.2} Q ${(x1+x2)/2} ${cy} ${x2} ${y+dir*RAD*0.2}`);
          path.setAttribute('marker-end', cyc?'url(#arrowc)':'url(#arrow)');
          path.setAttribute('class', cyc?'llink cyc':'llink back');
        } else {
          path.setAttribute('d',`M ${x1+RAD+2} ${y} L ${x2-RAD-8} ${y}`);
          path.setAttribute('marker-end','url(#arrow)'); path.setAttribute('class','llink');
        }
        svg.appendChild(path);
      });
      // pointers
      Object.entries(frame.ptr||{}).forEach(([name,id])=>{
        if(id==null) return; const el=nodeEls[id]; if(!el) return;
        el.classList.add('lp-'+name); el.classList.add('lactive');
        el.style.setProperty('--pc', ptrColor(name));
        let tag=el.querySelector('.ltag-'+name);
        if(!tag){ tag=document.createElement('div'); tag.className='ltag ltag-'+name; tag.textContent=ptrLabel(name); tag.style.color=ptrColor(name); el.appendChild(tag); }
      });
      // hide stale tags
      Object.values(nodeEls).forEach(el=>{
        [...el.querySelectorAll('.ltag')].forEach(t=>{
          const nm=[...t.classList].find(c=>c.startsWith('ltag-'))?.slice(5);
          if(nm && !(frame.ptr&&nm in frame.ptr && frame.ptr[nm]!=null && nodeEls[frame.ptr[nm]]===el)) t.remove();
        });
      });
      this._extra.innerHTML = varsHTML(frame);
    },
    clear(){ if(mount) mount.innerHTML=''; }
  };
}

/* ============================================================
   MERGE-LIST visualizer (merge two sorted lists)
   ============================================================ */
function MergeListViz(){
  let mount;
  return {
    setup(m, frames){ mount=m; mount.innerHTML=''; this._extra=document.createElement('div'); this._extra.className='extra';
      this._wrap=document.createElement('div'); this._wrap.className='mlwrap'; mount.appendChild(this._wrap); mount.appendChild(this._extra);
      this._frames=frames; },
    show(frame){
      const A=frame.listA||[], B=frame.listB||[], out=frame.out||[];
      const idMap={}; [...A,...B].forEach(n=>idMap[n.id]=n.val);
      const rowHTML=(label,nodes,activeId,color)=>`<div class="mlrow"><div class="row-label">${label}</div><div class="mlnodes">${
        nodes.map(n=>`<div class="mlnode ${n.id===activeId?'mlactive':''}" ${n.id===activeId?`style="--ac:${color}"`:''}>${n.val}</div>`).join('<span class="mlarrow">→</span>')||'<span class="chip empty">∅</span>'}</div></div>`;
      const outHTML=`<div class="mlrow out"><div class="row-label">output</div><div class="mlnodes">${
        out.map(id=>`<div class="mlnode mlout">${idMap[id]}</div>`).join('<span class="mlarrow">→</span>')||'<span class="chip empty">building…</span>'}</div></div>`;
      this._wrap.innerHTML = rowHTML('list A',A,frame.ptr&&frame.ptr.i,'#37e0c8')+rowHTML('list B',B,frame.ptr&&frame.ptr.j,'#ffb454')+outHTML;
      this._extra.innerHTML = varsHTML(frame);
    },
    clear(){ if(mount) mount.innerHTML=''; }
  };
}

/* ============================================================
   GRAPH / TRIE visualizer
   ============================================================ */
function GraphViz(){
  const NS='http://www.w3.org/2000/svg';
  let mount, stage, svg, nodeEls={}, W=0,H=0;
  return {
    setup(m, frames){
      mount=m; mount.innerHTML=''; nodeEls={}; W=0;H=0;
      frames.forEach(f=>(f.nodes||[]).forEach(n=>{ W=Math.max(W,n.x); H=Math.max(H,n.y); }));
      stage=document.createElement('div'); stage.className='graph-stage';
      stage.style.width=(W+80)+'px'; stage.style.height=(H+80)+'px';
      svg=document.createElementNS(NS,'svg'); svg.setAttribute('width',W+80); svg.setAttribute('height',H+80); svg.setAttribute('class','graph-svg');
      const defs=document.createElementNS(NS,'defs');
      defs.innerHTML='<marker id="garrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8b96b8"/></marker>'+
                     '<marker id="garrowA" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#37e0c8"/></marker>';
      svg.appendChild(defs); stage.appendChild(svg); mount.appendChild(stage);
      const extra=document.createElement('div'); extra.className='extra'; mount.appendChild(extra); this._extra=extra;
    },
    show(frame){
      const pos={}; (frame.nodes||[]).forEach(n=>pos[n.id]=n);
      while(svg.childNodes.length>1) svg.removeChild(svg.lastChild);
      (frame.edges||[]).forEach(e=>{
        const a=pos[e.a], b=pos[e.b]; if(!a||!b) return;
        const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len, R=24;
        const x1=a.x+22+ux*R, y1=a.y+22+uy*R, x2=b.x+22-ux*R, y2=b.y+22-uy*R;
        const ln=document.createElementNS(NS,'line');
        ln.setAttribute('x1',x1); ln.setAttribute('y1',y1); ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
        const act=e.state==='active';
        ln.setAttribute('class','gedge'+(act?' gedge-a':''));
        if(e.dir) ln.setAttribute('marker-end', act?'url(#garrowA)':'url(#garrow)');
        svg.appendChild(ln);
        if(e.label){ const tx=document.createElementNS(NS,'text');
          tx.setAttribute('x',(x1+x2)/2); tx.setAttribute('y',(y1+y2)/2-5); tx.setAttribute('class','gelabel'); tx.textContent=e.label; svg.appendChild(tx); }
      });
      const seen=new Set();
      (frame.nodes||[]).forEach(n=>{ seen.add(String(n.id));
        let el=nodeEls[n.id];
        if(!el){ el=document.createElement('div'); el.className='gnode'; const sp=document.createElement('span'); el.appendChild(sp); el._sp=sp; stage.appendChild(el); nodeEls[n.id]=el; }
        el._sp.textContent=n.label;
        el.style.transform=`translate(${n.x}px,${n.y}px)`;
        el.className='gnode gn-'+(n.state||'idle');
        el.style.opacity=1;
      });
      Object.keys(nodeEls).forEach(id=>{ if(!seen.has(String(id))) nodeEls[id].style.opacity=0; });
      this._extra.innerHTML = varsHTML(frame)+panelsHTML(frame);
    },
    clear(){ if(mount) mount.innerHTML=''; }
  };
}

const RENDERERS = { rows:RowsViz, list:ListViz, mergelist:MergeListViz, tree:TreeViz, grid:GridViz, intervals:IntervalViz, graph:GraphViz };

/* ============================================================
   STAGE CONTROLLER (playback)
   ============================================================ */
const Stage = {
  frames:[], idx:0, playing:false, timer:null, speed:1, viz:null,
  open(problem){
    state.current=problem;
    const built=problem.build();
    this.frames=built.frames; this.idx=0; this.speed=1; this.playing=false;
    const mount=document.getElementById('viz-mount');
    if(this.viz) this.viz.clear();
    this.viz=RENDERERS[built.kind](); this.viz.setup(mount, this.frames);
    this.render(); this.updateBar();
  },
  render(){
    const f=this.frames[this.idx];
    this.viz.show(f);
    document.getElementById('narration').textContent = f.note||'';
    // code line highlight
    const code=document.getElementById('code-block');
    if(code){ [...code.querySelectorAll('.ln')].forEach(el=>el.classList.remove('hl'));
      if(f.line!=null){ const el=code.querySelector('.ln[data-l="'+f.line+'"]'); if(el){ el.classList.add('hl'); el.scrollIntoView({block:'nearest'}); } } }
    document.getElementById('frame-count').textContent=`${this.idx+1} / ${this.frames.length}`;
    this.updateBar();
  },
  updateBar(){ const b=document.getElementById('progress-fill'); if(b) b.style.width=((this.idx+1)/this.frames.length*100)+'%'; },
  step(d){ this.pause(); this.idx=Math.max(0,Math.min(this.frames.length-1,this.idx+d)); this.render(); },
  restart(){ this.pause(); this.idx=0; this.render(); },
  play(){ if(this.idx>=this.frames.length-1) this.idx=0;
    this.playing=true; document.getElementById('btn-play').innerHTML=ICON.pause;
    const tick=()=>{ if(!this.playing) return; if(this.idx>=this.frames.length-1){ this.pause(); return; }
      this.idx++; this.render(); this.timer=setTimeout(tick, 1000/this.speed); };
    this.timer=setTimeout(tick, 700/this.speed);
  },
  pause(){ this.playing=false; clearTimeout(this.timer); const b=document.getElementById('btn-play'); if(b) b.innerHTML=ICON.play; },
  toggle(){ this.playing?this.pause():this.play(); }
};

/* ---------- icons ---------- */
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>',
  restart:'<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.6-5.7 4.9 1.8 7.3L12 17.8 5.4 21.7l1.8-7.3L1.5 9.5 9 8.9z"/></svg>'
};

/* ============================================================
   PAGE UI
   ============================================================ */
function diffClass(d){ return d==='Easy'?'d-easy':d==='Medium'?'d-med':'d-hard'; }
function catName(k){ const c=CATS.find(c=>c[1]===k); return c?c[0]:k; }

function codeHTML(code){
  return code.split('\n').map((line,i)=>`<div class="ln" data-l="${i}"><span class="lno">${i}</span><code>${escapeHTML(line)||' '}</code></div>`).join('');
}
function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* deterministic "today's sprint" of 3 */
function todaysThree(){
  const day=Math.floor(Date.now()/864e5);
  let seed=day*2654435761 % 2**31; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const idxs=[...PROBLEMS.keys()]; for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
  // prefer to surface at least one animated in the trio
  idxs.sort((a,b)=> (PROBLEMS[b].build?1:0)-(PROBLEMS[a].build?1:0) );
  return idxs.slice(0,3);
}

function updateStreak(){
  const today=Math.floor(Date.now()/864e5);
  const last=store.get('lastDay',null); let streak=store.get('streak',0);
  if(last===today){} else if(last===today-1){ streak++; } else { streak=1; }
  store.set('lastDay',today); store.set('streak',streak);
  return streak;
}

function buildPage(){
  const app=document.getElementById('app');
  const total=PROBLEMS.length, solved=state.solved.size, animated=PROBLEMS.filter(p=>p.build).length;
  const streak=updateStreak();
  const three=todaysThree();

  app.innerHTML=`
    <header class="hero">
      <div class="hero-mark">&lt;/&gt;</div>
      <div class="hero-txt">
        <h1>Blind&nbsp;75 <span>Animated Trainer</span></h1>
        <p class="tagline">Watch the algorithm move. Rebuild the solution from memory. Repeat daily.</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><b id="stat-streak">${streak}</b><em>day streak</em></div>
        <div class="stat"><b id="stat-solved">${solved}</b><em>/ ${total} solved</em></div>
        <div class="stat"><b>${animated}</b><em>animated</em></div>
      </div>
    </header>

    <section class="sprint">
      <div class="sprint-head"><span class="sprint-kicker">Today's sprint</span><h2>3 to drill</h2>
        <button class="ghost" id="reshuffle">shuffle 3</button></div>
      <div class="sprint-cards" id="sprint-cards"></div>
    </section>

    <div class="toolbar">
      <input id="search" class="search" placeholder="Search 75 problems…" />
      <div class="chips-line" id="diff-chips">
        <button class="fchip active" data-diff="all">All</button>
        <button class="fchip" data-diff="Easy">Easy</button>
        <button class="fchip" data-diff="Medium">Medium</button>
        <button class="fchip" data-diff="Hard">Hard</button>
      </div>
      <div class="chips-line" id="mode-chips">
        <button class="fchip active" data-mode="all">All</button>
        <button class="fchip" data-mode="anim">▶ Animated</button>
        <button class="fchip" data-mode="star">★ Starred</button>
        <button class="fchip" data-mode="unsolved">Unsolved</button>
      </div>
    </div>

    <main id="list"></main>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-head">
          <div class="mh-left">
            <span class="mh-diff" id="m-diff"></span>
            <h3 id="m-title"></h3>
            <span class="mh-pat" id="m-pat"></span>
          </div>
          <div class="mh-right">
            <button class="icon-btn" id="m-star" title="Star">${ICON.star}</button>
            <button class="icon-btn" id="m-solve" title="Mark solved">✓</button>
            <button class="icon-btn" id="m-close" title="Close">✕</button>
          </div>
        </div>
        <div class="modal-body">
          <div class="stage-col">
            <div class="viz-mount" id="viz-mount"></div>
            <div class="narration" id="narration"></div>
            <div class="controls" id="controls">
              <button class="ctl" id="btn-restart" title="Restart">${ICON.restart}</button>
              <button class="ctl" id="btn-prev" title="Step back">${ICON.prev}</button>
              <button class="ctl play" id="btn-play" title="Play/Pause">${ICON.play}</button>
              <button class="ctl" id="btn-next" title="Step forward">${ICON.next}</button>
              <span class="frame-count" id="frame-count"></span>
              <label class="speed">speed
                <input type="range" id="speed" min="0.5" max="3" step="0.5" value="1"/>
                <b id="speed-val">1×</b>
              </label>
            </div>
            <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
          </div>
          <div class="info-col">
            <div class="tabs">
              <button class="tab active" data-tab="idea">Intuition</button>
              <button class="tab" data-tab="code">Code</button>
              <button class="tab" data-tab="comp">Complexity</button>
            </div>
            <div class="tab-body" id="tab-idea"></div>
            <div class="tab-body hidden" id="tab-code"><div class="code-block" id="code-block"></div></div>
            <div class="tab-body hidden" id="tab-comp"></div>
          </div>
        </div>
      </div>
    </div>`;

  renderSprint(three);
  renderList();
  wireEvents();
}

function cardHTML(p, i, compact){
  const num=PROBLEMS.indexOf(p)+1;
  const anim=p.build?'<span class="badge-anim">▶ animated</span>':'';
  const star=state.starred.has(p.name)?'starred':'';
  const solved=state.solved.has(p.name)?'solved':'';
  return `<button class="card ${solved} ${compact?'compact':''}" data-name="${escapeHTML(p.name)}">
    <div class="card-top"><span class="card-num">${String(num).padStart(2,'0')}</span>
      <span class="mh-diff ${diffClass(p.diff)}">${p.diff}</span>
      <span class="star ${star}" data-star="${escapeHTML(p.name)}">★</span></div>
    <div class="card-name">${p.name}</div>
    <div class="card-foot"><span class="pat">${p.pattern}</span>${anim}</div>
  </button>`;
}

function renderSprint(three){
  document.getElementById('sprint-cards').innerHTML = three.map(i=>cardHTML(PROBLEMS[i],i,true)).join('');
}

function renderList(){
  const host=document.getElementById('list');
  const groups={};
  PROBLEMS.forEach(p=>{
    if(state.filterDiff!=='all' && p.diff!==state.filterDiff) return;
    if(state.filterMode==='anim' && !p.build) return;
    if(state.filterMode==='star' && !state.starred.has(p.name)) return;
    if(state.filterMode==='unsolved' && state.solved.has(p.name)) return;
    if(state.q && !p.name.toLowerCase().includes(state.q) && !p.pattern.toLowerCase().includes(state.q)) return;
    (groups[p.cat]=groups[p.cat]||[]).push(p);
  });
  let html='';
  CATS.forEach(([name,key])=>{
    const list=groups[key]; if(!list||!list.length) return;
    const done=list.filter(p=>state.solved.has(p.name)).length;
    html+=`<section class="cat"><div class="cat-head"><h2>${name}</h2><span class="cat-count">${done}/${list.length}</span></div>
      <div class="cards">${list.map(p=>cardHTML(p)).join('')}</div></section>`;
  });
  if(!html) html='<div class="empty-state">No problems match these filters.</div>';
  host.innerHTML=html;
}

function openModal(p){
  const m=document.getElementById('modal'); m.classList.add('open'); m.setAttribute('aria-hidden','false');
  document.getElementById('m-title').textContent=p.name;
  const d=document.getElementById('m-diff'); d.textContent=p.diff; d.className='mh-diff '+diffClass(p.diff);
  document.getElementById('m-pat').textContent=p.pattern;
  document.getElementById('tab-idea').innerHTML=`<p class="idea">${p.idea}</p>`+
    (p.build?'':'<p class="note-soft">Animation for this one lands in a future sprint — trace the code below by hand for now.</p>');
  document.getElementById('code-block').innerHTML=codeHTML(p.code);
  document.getElementById('tab-comp').innerHTML=`<div class="comp"><span class="comp-k">Time / Space</span><span class="comp-v">${p.comp}</span></div>
    <p class="idea">Pattern: <b>${p.pattern}</b>. Category: ${catName(p.cat)}.</p>`;
  // reset tabs
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='idea'));
  document.querySelectorAll('.tab-body').forEach(b=>b.classList.add('hidden'));
  document.getElementById('tab-idea').classList.remove('hidden');
  // star/solve state
  syncModalBtns(p);
  // stage
  const mount=document.getElementById('viz-mount');
  const ctl=document.getElementById('controls'), prog=document.querySelector('.progress');
  if(p.build){ ctl.style.display=''; prog.style.display=''; document.getElementById('narration').style.display='';
    Stage.open(p);
  } else {
    if(Stage.viz) Stage.viz.clear();
    mount.innerHTML='<div class="no-anim">No animation yet — open <b>Code</b> and dry-run it.</div>';
    ctl.style.display='none'; prog.style.display='none'; document.getElementById('narration').style.display='none';
    // still auto-show code tab for non-animated
    document.querySelector('.tab[data-tab="code"]').click();
  }
}
function syncModalBtns(p){
  document.getElementById('m-star').classList.toggle('on', state.starred.has(p.name));
  document.getElementById('m-solve').classList.toggle('on', state.solved.has(p.name));
}
function closeModal(){ Stage.pause(); const m=document.getElementById('modal'); m.classList.remove('open'); m.setAttribute('aria-hidden','true'); }

function wireEvents(){
  document.getElementById('search').addEventListener('input',e=>{ state.q=e.target.value.trim().toLowerCase(); renderList(); });
  document.getElementById('diff-chips').addEventListener('click',e=>{ const b=e.target.closest('.fchip'); if(!b) return;
    state.filterDiff=b.dataset.diff; [...e.currentTarget.children].forEach(c=>c.classList.toggle('active',c===b)); renderList(); });
  document.getElementById('mode-chips').addEventListener('click',e=>{ const b=e.target.closest('.fchip'); if(!b) return;
    state.filterMode=b.dataset.mode; [...e.currentTarget.children].forEach(c=>c.classList.toggle('active',c===b)); renderList(); });
  document.getElementById('reshuffle').addEventListener('click',()=>{
    const idxs=[...PROBLEMS.keys()]; for(let i=idxs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idxs[i],idxs[j]]=[idxs[j],idxs[i]]; }
    renderSprint(idxs.slice(0,3));
  });

  // card + star delegation (list + sprint)
  document.getElementById('app').addEventListener('click',e=>{
    const star=e.target.closest('.star');
    if(star){ e.stopPropagation(); const name=star.dataset.star;
      if(state.starred.has(name)) state.starred.delete(name); else state.starred.add(name);
      persist(); star.classList.toggle('starred'); if(state.filterMode==='star') renderList(); return; }
    const card=e.target.closest('.card');
    if(card){ const p=PROBLEMS.find(x=>x.name===card.dataset.name); if(p) openModal(p); }
  });

  // modal controls
  document.getElementById('m-close').addEventListener('click',closeModal);
  document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  document.getElementById('btn-play').addEventListener('click',()=>Stage.toggle());
  document.getElementById('btn-next').addEventListener('click',()=>Stage.step(1));
  document.getElementById('btn-prev').addEventListener('click',()=>Stage.step(-1));
  document.getElementById('btn-restart').addEventListener('click',()=>Stage.restart());
  document.getElementById('speed').addEventListener('input',e=>{ Stage.speed=+e.target.value; document.getElementById('speed-val').textContent=e.target.value+'×'; });

  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
    document.querySelectorAll('.tab-body').forEach(b=>b.classList.add('hidden'));
    document.getElementById('tab-'+t.dataset.tab).classList.remove('hidden');
  }));

  document.getElementById('m-star').addEventListener('click',()=>{ const p=state.current; if(!p) return;
    if(state.starred.has(p.name)) state.starred.delete(p.name); else state.starred.add(p.name); persist(); syncModalBtns(p); renderList(); });
  document.getElementById('m-solve').addEventListener('click',()=>{ const p=state.current; if(!p) return;
    if(state.solved.has(p.name)) state.solved.delete(p.name); else state.solved.add(p.name); persist(); syncModalBtns(p);
    document.getElementById('stat-solved').textContent=state.solved.size; renderList(); });

  document.addEventListener('keydown',e=>{
    if(!document.getElementById('modal').classList.contains('open')) return;
    if(e.key==='Escape') closeModal();
    else if(e.key===' '){ e.preventDefault(); Stage.frames.length&&Stage.toggle(); }
    else if(e.key==='ArrowRight') Stage.frames.length&&Stage.step(1);
    else if(e.key==='ArrowLeft') Stage.frames.length&&Stage.step(-1);
  });
}

document.addEventListener('DOMContentLoaded', buildPage);

</script>
<script src="../study-controls.js"></script>
